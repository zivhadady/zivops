<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta name="author" content="{{ site.author }}">

    <title>{{ page.title | default: site.title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/zivops.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="background-grid"></div>

    <nav class="glass-nav">
        <div class="nav-brand">
            <a href="#about" class="logo" style="text-decoration: none;">
                <i class="fas fa-terminal"></i> ZivOps
            </a>
            <div class="system-status">
                <span class="pulse"></span> System Operational
            </div>
        </div>
        <div class="nav-links">
            <a href="#about">About</a>
            <a href="#skills">Tech Stack</a>
            <a href="#projects">Projects</a>
            <a href="#experience">Experience</a>
            <a href="#education">Education</a>
            <a href="#contact">Contact</a>
            <a href="https://github.com/zivhadady" target="_blank" rel="noopener noreferrer" class="nav-cta">
                <i class="fab fa-github"></i> GitHub
            </a>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author }} &bull; DevOps & Cloud Infrastructure Engineer &bull; {{ site.location }}</p>
    </footer>
</body>

</html>
