name: CD - Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
    paths:
      - '**/*.html'
      - '**/*.css'
      - '_config.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set dynamic baseurl and build
        id: build_step
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            BASEURL="/zivops"
            DEST_DIR=""
          else
            BASEURL="/zivops/${{ github.ref_name }}"
            DEST_DIR="${{ github.ref_name }}"
          fi
          echo "dest_dir=$DEST_DIR" >> $GITHUB_OUTPUT
          bundle exec jekyll build --baseurl "$BASEURL" --destination ./_site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: ${{ steps.build_step.outputs.dest_dir }}
